# docker-compose.test.yml - Bases de datos temporales para tests de integración
version: '3.8'

services:
  # PostgreSQL para tests
  postgres-test:
    image: postgres:16-alpine
    container_name: logistics-postgres-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: logistics_test
    ports:
      - "5433:5432"  # Puerto diferente para evitar conflictos con desarrollo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Sin volúmenes persistentes - se elimina todo al terminar
    tmpfs:
      - /var/lib/postgresql/data  # Usar tmpfs para mejor rendimiento

  # MongoDB para tests
  mongodb-test:
    image: mongo:7.0
    container_name: logistics-mongodb-test
    environment:
      MONGO_INITDB_DATABASE: logistics_tracking_test
    ports:
      - "27018:27017"  # Puerto diferente para evitar conflictos con desarrollo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Sin volúmenes persistentes - se elimina todo al terminar
    tmpfs:
      - /data/db  # Usar tmpfs para mejor rendimiento

networks:
  default:
    name: logistics-test-network

